<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Download CGai</title>

  <script>
    const ua = navigator.userAgent || navigator.vendor || window.opera;

    const isAndroid = /android/i.test(ua);

    // Handles iPhone/iPad, including newer iPads that identify as Mac
    const isIOS =
      /iPad|iPhone|iPod/.test(ua) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    if (isIOS) {
      window.location.replace(
        "https://apps.apple.com/us/app/id6479258909"
      );
    } else if (isAndroid) {
      window.location.replace(
        "https://play.google.com/store/apps/details?id=ai.capitalgain.app"
      );
    } else {
      window.location.replace(
        "https://capitalgain.ai"
      );
    }
  </script>
</head>

<body>
  <p>Opening CapitalGain.AI…</p>
</body>
</html>
